    items: [
      {
        id: 'copywriting', name: '카피라이팅 & 스토리텔링',

        w: { performance:1, content:3, brand:3, growth:1, crm:2, ae:2 }
      },

        id: 'content_create', name: '콘텐츠 기획 & 제작',
        desc: '블로그, SNS, 숏폼 영상 등 다양한 포맷의 콘텐츠를 기획하고 만들 수 있다',
        w: { performance:1, content:3, brand:2, growth:1, crm:2, ae:2 }

        desc: '피그마, 포토샵, 캔바 등으로 시각 자료를 직접 제작할 수 있다',

        w: { performance:1, content:3, brand:2, growth:1, crm:1, ae:2 }

        desc: '마케팅 캠페인의 목표-전략-실행-회고까지 한 사이클을 경험했다',
        w: { performance:2, content:1, brand:3, growth:1, crm:1, ae:3 }
      },
      {
        id: 'brand_strategy', name: '브랜드 전략 & 아이덴티티 설계',
        desc: '브랜드 포지셔닝, 톤앤매너, 페르소나 등을 설계할 수 있다',
        w: { performance:0, content:2, brand:3, growth:0, crm:1, ae:2 }
      },
      {
        id: 'project_manage', name: '프로젝트 관리 & 일정 조율',
        desc: '복수의 업무를 동시에 관리하고 데드라인을 조율할 수 있다',
        w: { performance:1, content:1, brand:2, growth:2, crm:2, ae:3 }
      },
    ]
  },
  {
    category: '👥 고객 & 관계',
    items: [
      {
        id: 'customer_journey', name: '고객 여정 분석 & 페르소나 설계',
        desc: '타겟 고객의 행동 패턴과 니즈를 분석하여 전략에 반영할 수 있다',
        w: { performance:1, content:2, brand:2, growth:3, crm:3, ae:1 }
      },
      {
        id: 'crm_tool', name: 'CRM 툴 & 메시지 자동화',
        desc: '이메일, 앱 푸시, 문자 등 고객 메시지 자동화를 설정해봤다',
        w: { performance:0, content:1, brand:0, growth:2, crm:3, ae:0 }
      },
      {
        id: 'client_comm', name: '클라이언트 커뮤니케이션 & 제안',
        desc: '고객사 또는 이해관계자에게 기획안을 발표하고 설득할 수 있다',
        w: { performance:0, content:1, brand:2, growth:0, crm:1, ae:3 }
      },
      {
        id: 'retention', name: '리텐션 & 재구매 전략',
        desc: '기존 고객이 다시 돌아오도록 하는 전략을 설계하거나 실행해봤다',
        w: { performance:1, content:1, brand:1, growth:3, crm:3, ae:0 }

// Pre-compute max scores per job
const MAX = {};
JOBS.forEach(j => {
  MAX[j.id] = COMPETENCIES.flatMap(c => c.items).reduce((s, item) => s + item.w[j.id], 0);
});

// ─── Render checklist ───────────────────────────────────────────
function renderChecklist() {
  const panel = document.getElementById('checklist');
  COMPETENCIES.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.className = 'category';
    const title = document.createElement('div');
    title.className = 'category-title';
    title.textContent = cat.category;
    wrap.appendChild(title);

    cat.items.forEach(item => {
      const label = document.createElement('label');
      label.className = 'competency-item';
      label.innerHTML = `
        <input type="checkbox" id="${item.id}">
        <div class="comp-label">
          <div class="comp-name">${item.name}</div>
          <div class="comp-desc">${item.desc}</div>
        </div>`;
      label.querySelector('input').addEventListener('change', update);
      wrap.appendChild(label);
    });
    panel.appendChild(wrap);
  });
}

// ─── Calculate scores ───────────────────────────────────────────
function getScores() {
  const scores = {};
  JOBS.forEach(j => scores[j.id] = 0);
  COMPETENCIES.flatMap(c => c.items).forEach(item => {
    if (document.getElementById(item.id)?.checked) {
      JOBS.forEach(j => scores[j.id] += item.w[j.id]);
    }
  });
  return scores;
}

function getNorm(scores) {
  const n = {};
  JOBS.forEach(j => n[j.id] = MAX[j.id] ? scores[j.id] / MAX[j.id] : 0);
  return n;
}

// ─── Update UI ──────────────────────────────────────────────────
function update() {
  // Sync checked style
  let count = 0;
  COMPETENCIES.flatMap(c => c.items).forEach(item => {
    const el = document.getElementById(item.id);
    if (!el) return;
    el.closest('.competency-item').classList.toggle('checked', el.checked);
    if (el.checked) count++;
  });
  document.getElementById('checked-count').textContent = count;

  const scores = getScores();
  const norm   = getNorm(scores);

  drawRadar(norm);
  renderBars(norm);
  renderTopPick(norm, count);
}

// ─── Radar chart ────────────────────────────────────────────────
function drawRadar(norm) {
  const svg = document.getElementById('radar');
  svg.innerHTML = '';
  const cx = 150, cy = 150, R = 104, n = JOBS.length;
  const angle = i => (Math.PI * 2 * i / n) - Math.PI / 2;
  const pt    = (i, r) => [cx + r * Math.cos(angle(i)), cy + r * Math.sin(angle(i))];
  const poly  = (pts, fill, stroke, sw) => {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    el.setAttribute('points', pts.map(p => p.join(',')).join(' '));
    el.setAttribute('fill', fill);
    el.setAttribute('stroke', stroke);
    el.setAttribute('stroke-width', sw);
    return el;
  };

  // Grid rings
  [0.25, 0.5, 0.75, 1].forEach(lv => {
    svg.appendChild(poly(JOBS.map((_, i) => pt(i, R * lv)), 'none', '#E5E7EB', '1'));
  });

  // Axis lines
  JOBS.forEach((_, i) => {
    const [x2, y2] = pt(i, R);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    ['x1','y1','x2','y2','stroke','stroke-width'].forEach((a,idx) =>
      line.setAttribute(a, [cx, cy, x2, y2, '#E5E7EB', '1'][idx]));
    svg.appendChild(line);
  });

  // Data polygon
  svg.appendChild(poly(
    JOBS.map((j, i) => pt(i, R * norm[j.id])),
    'rgba(79,70,229,0.18)', '#4F46E5', '2'
  ));

  // Dots on data
  JOBS.forEach((j, i) => {
    const [dx, dy] = pt(i, R * norm[j.id]);
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', dx); c.setAttribute('cy', dy);
    c.setAttribute('r', '4'); c.setAttribute('fill', '#4F46E5');
    svg.appendChild(c);
  });

  // Labels
  JOBS.forEach((job, i) => {
    const [lx, ly] = pt(i, R + 24);
    const lines = job.name.split('\n');
    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('font-size', '10');
    text.setAttribute('font-weight', '700');
    text.setAttribute('fill', job.color);
    text.setAttribute('font-family', 'Apple SD Gothic Neo, Noto Sans KR, sans-serif');
    lines.forEach((line, li) => {
      const tspan = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
      tspan.setAttribute('x', lx);
      tspan.setAttribute('dy', li === 0 ? (lines.length > 1 ? `-${(lines.length-1)*6}` : '4') : '13');
      tspan.textContent = line;
      text.appendChild(tspan);
    });
    svg.appendChild(text);
  });
}

// ─── Bars ────────────────────────────────────────────────────────
function renderBars(norm) {
  const sorted = [...JOBS].sort((a, b) => norm[b.id] - norm[a.id]);
  document.getElementById('job-bars').innerHTML = sorted.map(job => {
    const pct = Math.round(norm[job.id] * 100);
    return `<div class="job-bar">
      <div class="job-bar-header">
        <span class="job-name" style="color:${job.color}">${job.short}</span>
        <span class="job-pct">${pct}%</span>
      </div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${pct}%;background:${job.color}"></div>
      </div>
    </div>`;
  }).join('');
}

// ─── Top pick ────────────────────────────────────────────────────
function renderTopPick(norm, count) {
  const top = JOBS.reduce((a, b) => norm[a.id] >= norm[b.id] ? a : b);
  const pct = Math.round(norm[top.id] * 100);
  if (count === 0) {
    document.getElementById('top-job').textContent = '역량을 선택해주세요';
    document.getElementById('top-job').style.color = '#4338CA';
    document.getElementById('top-reason').textContent = '체크할수록 결과가 정확해집니다';
  } else {
    document.getElementById('top-job').textContent = top.short;
    document.getElementById('top-job').style.color = top.color;
    document.getElementById('top-reason').textContent =
      `적합도 ${pct}% · ${JOB_REASONS[top.id]}`;
  }
}

// ─── Reset ───────────────────────────────────────────────────────
function resetAll() {
  COMPETENCIES.flatMap(c => c.items).forEach(item => {
    const el = document.getElementById(item.id);
    if (el) { el.checked = false; el.closest('.competency-item').classList.remove('checked'); }
  });
  update();
}

// Init
renderChecklist();
update();
</script>
